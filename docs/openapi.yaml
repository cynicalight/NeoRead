                    },
                  "stages":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/StageUsage" },
                    },
                  "unknownCalls": { "type": "integer", "minimum": 0 },
                  "failedCalls": { "type": "integer", "minimum": 0 },
                  "partialCalls": { "type": "integer", "minimum": 0 },
                  "elapsedMs": { "type": "integer", "minimum": 0 },
                },
              "required":
                [
                  "historyComplete",
                  "total",
                  "calls",
                  "groups",
                  "stages",
                  "unknownCalls",
                  "failedCalls",
                  "partialCalls",
                  "elapsedMs",
                ],
            },
          "Creator":
            {
              "type": "object",
              "description": "CSL-style name: given/family for split names, name for a single literal name",
              "properties":
                {
                  "given": { "type": "string" },
                  "family": { "type": "string" },
                  "name": { "type": "string" },
                },
            },
          "PaperMetadata":
            {
              "type": "object",
              "properties":
                {
                  "itemType":
                    {
                      "enum":
                        [
                          "journal",
                          "conference",
                          "preprint",
                          "thesis",
                          "book",
                          "chapter",
                          "report",
                          "other",
                        ],
                    },
                  "translatedTitle": { "type": "string" },
                  "shortTitle": { "type": "string" },
                  "creators":
                    {
                      "type": "array",
                      "maxItems": 200,
                      "items": { "$ref": "#/components/schemas/Creator" },
                    },
                  "affiliation": { "type": "string" },
                  "date":
                    {
                      "type": "string",
                      "pattern": "^\\d{4}(-\\d{2}(-\\d{2})?)?$",
                    },
                  "venue": { "type": "string" },
                  "volume": { "type": "string" },
                  "issue": { "type": "string" },
                  "pages": { "type": "string" },
                  "publisher": { "type": "string" },
                  "doi": { "type": "string" },
                  "arxiv": { "type": "string" },
                  "isbn": { "type": "string" },
                  "url": { "type": "string" },
                  "abstract": { "type": "string", "maxLength": 20000 },
                  "language": { "type": "string" },
                  "remark":
                    {
                      "type": "string",
                      "description": "The reader's own note on the item; never looked up",
                    },
                  "sources":
                    {
                      "type": "object",
                      "description": "Origin per field; lookups never replace manual values",
                      "additionalProperties":
                        { "enum": ["file", "lookup", "manual"] },
                    },
                  "lookedUpAt": { "type": "string" },
                  "lookup":
                    {
                      "enum": ["pending", "done", "notFound", "failed"],
                      "description": "Automatic lookup state for papers imported from files",
                    },
                },
            },
          "SentenceLink":
            {
              "type": "object",
              "required": ["origin", "parts"],
              "properties":
                {
                  "origin":
                    { "type": "string", "enum": ["source", "translation"] },
                  "parts":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "required":
                            [
                              "blockId",
                              "sourceHash",
                              "sentenceIndex",
                              "source",
                              "target",
                            ],
                          "properties":
                            {
                              "blockId": { "type": "string" },
                              "sourceHash": { "type": "string" },
                              "sentenceIndex":
                                { "type": "integer", "minimum": 0 },
                              "source": { "type": "string" },
                              "target": { "type": "string" },
                            },
                        },
                    },
                },
            },
          "TranslationLocation":
            {
              "type": "object",
              "required":
                ["blockId", "sourceHash", "sentenceIndexes", "start", "end"],
              "properties":
                {
                  "blockId": { "type": "string" },
                  "sourceHash": { "type": "string" },
                  "sentenceIndexes":
                    {
                      "type": "array",
                      "items": { "type": "integer", "minimum": 0 },
                    },
                  "start": { "type": "integer", "minimum": 0 },
                  "end": { "type": "integer", "minimum": 0 },
                  "ranges":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "required":
                            [
                              "blockId",
                              "sourceHash",
                              "sentenceIndexes",
                              "start",
                              "end",
                              "quote",
                            ],
                          "properties":
                            {
                              "blockId": { "type": "string" },
                              "sourceHash": { "type": "string" },
                              "sentenceIndexes":
                                {
                                  "type": "array",
                                  "items": { "type": "integer", "minimum": 0 },
                                },
                              "start": { "type": "integer", "minimum": 0 },
                              "end": { "type": "integer", "minimum": 0 },
                              "quote": { "type": "string" },
                              "location":
                                { "$ref": "#/components/schemas/EPUBLocation" },
                            },
                        },
                    },
                },
            },
          "EPUBLocation":
            {
              "type": "object",
              "properties":
                {
                  "type": { "const": "epub" },
                  "href": { "type": "string" },
                  "blockId": { "type": "string" },
                  "start": { "type": "integer", "minimum": 0 },
                  "end": { "type": "integer", "minimum": 0 },
                  "endBlockId": { "type": "string" },
                  "locator": { "type": "string" },
                  "progression": { "type": "number" },
                  "quote": { "type": "string" },
                  "sentenceLink":
                    { "$ref": "#/components/schemas/SentenceLink" },
                  "translation":
                    { "$ref": "#/components/schemas/TranslationLocation" },
                },
              "required": ["type", "href"],
            },
          "EPUBChapters":
            {
              "type": "object",
              "required": ["chapters", "toc"],
              "properties":
                {
                  "chapters":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/EPUBChapter" },
                    },
                  "toc":
                    {
                      "type": ["array", "null"],
                      "items":
                        { "$ref": "#/components/schemas/EPUBChapterLink" },
                    },
                },
            },
          "EPUBChapter":
            {
              "type": "object",
              "required": ["href", "title", "index", "characters", "blocks"],
              "properties":
                {
                  "href": { "type": "string" },
                  "title": { "type": "string" },
                  "index": { "type": "integer" },
                  "characters": { "type": "integer" },
                  "blocks":
                    {
                      "type": "array",
                      "items":
                        { "$ref": "#/components/schemas/EPUBReadingBlock" },
                    },
                },
            },
          "EPUBChapterLink":
            {
              "type": "object",
              "required": ["href", "title"],
              "properties":
                {
                  "href": { "type": "string" },
                  "title": { "type": "string" },
                  "children":
                    {
                      "type": "array",
                      "items":
                        { "$ref": "#/components/schemas/EPUBChapterLink" },
                    },
                },
            },
          "EPUBReadingBlock":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "label": { "type": "string" },
                  "text": { "type": "string" },
                  "location": { "$ref": "#/components/schemas/EPUBLocation" },
                  "image": { "type": "string" },
                },
              "required": ["id", "label", "text", "location"],
            },
        },
    },
}
