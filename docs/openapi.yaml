      "/api/documents/{id}/messages/{message}/sources/{source}":
        {
          "get":
            {
              "summary": "Validate a persisted original-text citation before navigation",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "in": "path",
                    "name": "message",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "in": "path",
                    "name": "source",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Original source is still current",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "required": ["valid"],
                                  "properties":
                                    { "valid": { "type": "boolean" } },
