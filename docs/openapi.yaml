{
  "openapi": "3.1.0",
  "info": { "title": "Reader Local API", "version": "0.1.0" },
  "security": [{ "session": [] }],
  "paths":
    {
      "/api/translate-selection":
        {
          "post":
            {
              "summary": "Translate selected text using at most 30 nearby words on each side",
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["text"],
                              "additionalProperties": false,
                              "properties":
                                {
                                  "text":
                                    {
                                      "type": "string",
                                      "minLength": 1,
                                      "maxLength": 12000,
                                    },
                                  "before": { "type": "string" },
                                  "after": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Completed translation; not persisted",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "required": ["text"],
                                  "properties":
                                    { "text": { "type": "string" } },
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/overviews":
        {
          "get":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Overview job states",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    {
                                      "$ref": "#/components/schemas/OverviewJob",
                                    },
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/overview":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Persisted source-versioned overview",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/DocumentOverview",
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
          "post":
            {
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                { "regenerate": { "type": "boolean" } },
                              "required": ["regenerate"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Existing overview or job",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/DocumentOverview",
                                },
                            },
                        },
                    },
                  "202":
                    {
                      "description": "Overview queued",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/DocumentOverview",
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/overview/job":
        {
          "delete":
            {
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "204":
                    {
                      "description": "Overview job canceled; translation unaffected",
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/diagnostics/events":
        {
          "post":
            {
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "additionalProperties": false,
                              "required": ["level", "event"],
                              "properties":
                                {
                                  "level":
                                    {
                                      "type": "string",
                                      "enum": ["info", "warn", "error"],
                                    },
                                  "event":
                                    {
                                      "type": "string",
                                      "maxLength": 80,
                                      "pattern": "^[a-z][a-z0-9_.-]{0,79}$",
                                    },
                                  "detail":
                                    { "type": "string", "maxLength": 512 },
                                  "stack":
                                    { "type": "string", "maxLength": 8000 },
                                  "requestId":
                                    { "type": "string", "maxLength": 512 },
                                  "route":
                                    { "type": "string", "maxLength": 512 },
                                  "method":
                                    { "type": "string", "maxLength": 512 },
                                  "status": { "type": "number", "minimum": 0 },
                                  "durationMs":
                                    { "type": "number", "minimum": 0 },
                                },
                            },
                        },
                    },
                },
              "responses":
                {
                  "204": { "description": "Local diagnostic event recorded" },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/diagnostics/export":
        {
          "get":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "ZIP containing all retained local logs with redaction and a manifest",
                      "content":
                        {
                          "application/zip":
                            {
                              "schema":
                                { "type": "string", "format": "binary" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/journal-ranks/config":
        {
          "get":
            {
              "summary": "Read local easyScholar settings without the SecretKey",
              "responses":
                {
                  "200":
                    {
                      "description": "Settings and known datasets",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/JournalRankConfig",
                                },
                            },
                        },
                    },
                },
            },
          "put":
            {
              "summary": "Save easyScholar settings; omitted key preserves the saved key",
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "enabled": { "type": "boolean" },
                                  "filterMode":
                                    {
                                      "type": "string",
                                      "enum": ["include", "exclude"],
                                    },
                                  "selected":
                                    {
                                      "type": "array",
                                      "items": { "type": "string" },
                                    },
                                  "key": { "type": "string" },
                                },
                              "required": ["enabled", "selected"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Saved settings",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/JournalRankConfig",
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/journal-rank":
        {
          "get":
            {
              "summary": "Query or read cached journal indicators for one paper",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "refresh",
                    "in": "query",
                    "schema": { "type": "string", "enum": ["1"] },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Journal indicator result",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/JournalRankResult",
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/connector/status":
        {
          "get":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Connector bridge availability",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    {
                                      "available": { "type": "boolean" },
                                      "reason":
                                        {
                                          "type": "string",
                                          "enum": ["disabled", "port-in-use"],
                                        },
                                    },
                                  "required": ["available"],
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/connector/revision":
        {
          "get":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Revision after connector imports",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    { "revision": { "type": "integer" } },
                                  "required": ["revision"],
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/snapshot":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Saved source snapshot availability",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    {
                                      "available": { "type": "boolean" },
                                      "sourceUrl": { "type": "string" },
                                    },
                                  "required": ["available"],
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/import/zotero":
        {
          "get":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    { "directory": { "type": "string" } },
                                  "required": ["directory"],
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
          "post":
            {
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "scanId": { "type": "string" },
                                  "entryId": { "type": "string" },
                                  "library":
                                    {
                                      "type": "string",
                                      "enum": ["papers", "books"],
                                      "default": "papers",
                                    },
                                  "allowLarge":
                                    { "type": "boolean", "default": false },
                                },
                              "required": ["scanId", "entryId"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ZoteroImportResult",
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/import/zotero/scan":
        {
          "post":
            {
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "directory": { "type": "string" },
                                  "linkedBase": { "type": "string" },
                                },
                              "required": ["directory"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/ZoteroScan" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "Zotero is holding a database lock; quit Zotero and retry the scan",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "required": ["error", "code"],
                                  "properties":
                                    {
                                      "error": { "type": "string" },
                                      "code":
                                        {
                                          "type": "string",
                                          "const": "zotero-locked",
                                        },
                                    },
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents":
        {
          "get":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    { "$ref": "#/components/schemas/Document" },
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
          "post":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "The identical file already exists, in either library",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "201":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "multipart/form-data":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "file":
                                    { "type": "string", "format": "binary" },
                                  "library":
                                    {
                                      "enum": ["books", "papers"],
                                      "description": "Target library. Papers accept PDFs; over 100 MB or 100 pages requires confirmation. Defaults to books.",
                                    },
                                  "allowLarge":
                                    {
                                      "enum": ["1"],
                                      "description": "Confirms a paper over 100 pages or 100 MB. Without it such a paper fails with 409, code large-paper and its page count.",
                                    },
                                },
                              "required": ["file"],
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}":
        {
          "patch":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "category":
                                    { "enum": ["book", "article", "paper"] },
                                  "tags":
                                    {
                                      "type": "array",
                                      "maxItems": 30,
                                      "items":
                                        {
                                          "type": "string",
                                          "minLength": 1,
                                          "maxLength": 40,
                                        },
                                    },
                                  "folders":
                                    {
                                      "type": "array",
                                      "maxItems": 30,
                                      "items":
                                        {
                                          "type": "string",
                                          "minLength": 1,
                                          "maxLength": 40,
                                        },
                                    },
                                  "favorite": { "type": "boolean" },
                                  "progress":
                                    {
                                      "$ref": "#/components/schemas/DocumentLocation",
                                    },
                                  "percentage": { "type": "number" },
                                  "title":
                                    {
                                      "type": "string",
                                      "minLength": 1,
                                      "maxLength": 300,
                                    },
                                  "author":
                                    { "type": "string", "maxLength": 200 },
                                  "library": { "enum": ["books", "papers"] },
                                  "metadata":
                                    {
                                      "type": "object",
                                      "description": "Fields to replace; each becomes a manual value. Empty strings clear a field.",
                                      "properties":
                                        {
                                          "itemType":
                                            {
                                              "enum":
                                                [
                                                  "journal",
                                                  "conference",
                                                  "preprint",
                                                  "thesis",
                                                  "book",
                                                  "chapter",
                                                  "report",
                                                  "other",
                                                ],
                                            },
                                          "translatedTitle":
                                            { "type": "string" },
                                          "shortTitle": { "type": "string" },
                                          "creators":
                                            {
                                              "type": "array",
                                              "maxItems": 200,
                                              "items":
                                                {
                                                  "$ref": "#/components/schemas/Creator",
                                                },
                                            },
                                          "affiliation": { "type": "string" },
                                          "date":
                                            {
                                              "type": "string",
                                              "pattern": "^\\d{4}(-\\d{2}(-\\d{2})?)?$",
                                            },
                                          "venue": { "type": "string" },
                                          "volume": { "type": "string" },
                                          "issue": { "type": "string" },
                                          "pages": { "type": "string" },
                                          "publisher": { "type": "string" },
                                          "doi": { "type": "string" },
                                          "arxiv": { "type": "string" },
                                          "isbn": { "type": "string" },
                                          "url": { "type": "string" },
                                          "abstract":
                                            {
                                              "type": "string",
                                              "maxLength": 20000,
                                            },
                                          "language": { "type": "string" },
                                          "remark":
                                            {
                                              "type": "string",
                                              "maxLength": 20000,
                                            },
                                        },
                                      "additionalProperties": false,
                                    },
                                  "readingStatus":
                                    { "enum": ["unread", "reading", "done"] },
                                },
                              "required": [],
                            },
                        },
                    },
                },
            },
          "delete":
            {
              "summary": "Permanently delete a document and its library-owned data after stopping background tasks",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "204": { "description": "Deleted or already absent" },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/classification":
        {
          "post":
            {
              "summary": "Retry AI classification; manual types are protected",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Queued",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/annotations/undo":
        {
          "post":
            {
              "description": "Undo the latest annotation mutation from this window and document. Restores merged/deleted marks and original IDs atomically; rejects changes superseded by another client. History is in-memory, bounded to the latest 100 operations and 16 MiB across the server.",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "X-Reader-Undo-Session",
                    "in": "header",
                    "required": true,
                    "schema":
                      { "type": "string", "minLength": 1, "maxLength": 128 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Undo result; use the returned annotations only when undone is true",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "required": ["undone", "annotations"],
                                  "properties":
                                    {
                                      "undone": { "type": "boolean" },
                                      "annotations":
                                        {
                                          "type": "array",
                                          "items":
                                            {
                                              "$ref": "#/components/schemas/Annotation",
                                            },
                                        },
                                    },
                                },
