                  "type",
                  "title",
                  "author",
                  "size",
                  "createdAt",
                  "lastOpenedAt",
                  "favorite",
                  "percentage",
                  "library",
                  "metadata",
                  "readingStatus",
                  "noteCount",
                  "highlightCount",
                  "openQuestionCount",
