name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET || 'neoread' }}
  R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL || 'https://208624959c9d215edea0720162a740c1.r2.cloudflarestorage.com' }}
  R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://neoread-dl.chatbox.run' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      verified: ${{ steps.ci.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate versions and pin source commit
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-source.mjs

      - name: Validate R2 configuration before building
        if: github.event_name == 'release'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/release-r2.mjs --check-config

      - name: Reuse successful CI for this exact source commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release-ci.mjs

  checks:
    needs: prepare
    if: needs.prepare.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  desktop:
    needs: [prepare, checks]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ github.event.release.tag_name || '' }}
      mac-only: ${{ contains(github.event.release.body, '<!-- neoread:mac-only -->') }}

  publish:
    needs: [prepare, desktop]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Serialize publication across tags because stable download aliases are shared.
    concurrency:
      group: neoread-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      MAC_ONLY: ${{ contains(github.event.release.body, '<!-- neoread:mac-only -->') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: neoread-*
          path: release
          merge-multiple: true
      - name: Verify complete installer set and generate checksums
        run: node scripts/release-assets.mjs
      - name: Store checksums for manual dry runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neoread-checksums
          path: release/SHA256SUMS.txt
      - name: Preview R2 download links without publishing
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-r2.mjs --dry-run
      - name: Attach installers to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-assets.mjs --upload
      - name: Publish installers to R2 and add download links
        if: github.event_name == 'release'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          aws --version
          node scripts/release-r2.mjs
