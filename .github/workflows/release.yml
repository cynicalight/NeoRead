name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing published tag to rebuild and upload; empty for a dry run"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release-tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      verified: ${{ steps.ci.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-tag || github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate versions and pin source commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: node scripts/release-source.mjs

      - name: Require an existing published release for manual recovery
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false

      - name: Reuse successful CI for this exact source commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release-ci.mjs

  checks:
    needs: prepare
    if: needs.prepare.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  desktop:
    needs: [prepare, checks]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ inputs.release-tag || github.event.release.tag_name || '' }}
      mac-only: ${{ contains(github.event.release.body, '<!-- neoread:mac-only -->') }}

  publish:
    needs: [prepare, desktop]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MAC_ONLY: ${{ contains(github.event.release.body, '<!-- neoread:mac-only -->') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: neoread-*
          path: release
          merge-multiple: true
      - name: Verify complete installer set and generate checksums
        run: node scripts/release-assets.mjs
      - name: Store checksums for manual dry runs
        if: github.event_name == 'workflow_dispatch' && inputs.release-tag == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neoread-checksums
          path: release/SHA256SUMS.txt
      - name: Attach installers to the published release
        if: github.event_name == 'release' || inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: node scripts/release-assets.mjs --upload
