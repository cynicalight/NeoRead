name: CI

# Direct pushes to main skip CI; pull requests, releases and manual runs keep the full checks.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:go
      - name: Test shared and macOS code
        run: pnpm exec vitest run --exclude "apps/desktop/main/windows-proxy*.test.ts"

  windows-proxy:
    # Windows proxy conversion tests — pure logic, no real Clash dependency.
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Windows proxy conversion and reading
        run: pnpm exec vitest run apps/desktop/main/windows-proxy.test.ts apps/desktop/main/windows-proxy-neoread.test.ts

  windows-command-line:
    # The command-line installer edits the user PATH through PowerShell and the
    # registry; only a Windows runner exercises that path.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Test the Windows PATH installer
        run: pnpm exec vitest run apps/desktop/main/command-line.windows.test.ts
      - name: Test Windows Codex npm startup and argument/stdin transport
        working-directory: apps/server
        run: go test ./internal/runtimeenv -run '^(TestCodexNpm|TestWindowsCodexNpm|TestCodexNativeProcessHelper)' -count=1

  windows-attachments:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Test Windows attachment cleanup and byte-range serving
        working-directory: apps/server
        run: go test ./internal/neoread -run '^TestPaperAttachment(Download|FileRanges|CountUses)' -count=1
      - name: Test Windows Reader migration and cleanup
        working-directory: apps/server
        run: go test ./internal/neoread -run '^TestReader(Migration|Cleanup)' -count=1
